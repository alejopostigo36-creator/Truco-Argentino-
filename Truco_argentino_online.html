<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">

<title>Truco argentino: creado por Alejo Postigo</title>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--paño:#123524;--crema:#f6edd3;--oro:#e0b043;--rojo:#b8402e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:#123524;color:#f6edd3;font:15px/1.4 Karla,system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;padding:10px 12px 24px}
h1{font:22px 'Alfa Slab One',Georgia,serif;margin:4px 0 8px;color:var(--oro)}
.sc{display:flex;gap:8px;margin-bottom:10px}
.sc div{flex:1;border:2px solid #f6edd355;border-radius:10px;padding:6px 10px}
.sc b{font:26px 'Alfa Slab One',Georgia,serif;margin-right:6px}
.sc small{opacity:.8}
.row{display:flex;gap:8px;justify-content:center;margin:6px 0}
.cd{display:block;width:78px;height:125px;border-radius:9px}
.cd.my{width:80px;height:128px;cursor:pointer;filter:drop-shadow(0 3px 4px #0009)}
.cd.sm{width:62px;height:99px;filter:drop-shadow(0 2px 3px #0009)}
.cd.bk{background:repeating-linear-gradient(45deg,#8c2f22 0 6px,#a63a2b 6px 12px);border:2px solid #f1edf4}
.cd.win{filter:drop-shadow(0 0 3px #e0b043) drop-shadow(0 0 3px #e0b043)}
.tb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:repeating-linear-gradient(95deg,#6b4426 0 14px,#5e3b20 14px 19px,#74492a 19px 30px);border-radius:0 0 12px 12px;padding:10px 8px;margin:0 0 8px}
.hh{display:flex;justify-content:space-between;align-items:center}
.pl{display:block;width:100%;border-radius:12px 12px 0 0}
.pl *{transform-box:fill-box;transform-origin:center}.pl .hd{transform-origin:50% 100%}
.pl .ey{animation:bl 4s infinite}@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.pl .hd{animation:sw 5s ease-in-out infinite alternate}@keyframes sw{to{transform:rotate(1.5deg)}}
.pl.talk .mo{animation:mo .22s infinite alternate}@keyframes mo{from{transform:scaleY(1)}to{transform:scaleY(3.4)}}
.dt{opacity:0}.pl.think .dt{opacity:1}.pl.think .pu{transform:translate(-3px,-3px)}.pl.think .br{transform:translateY(-3px)}
.pl.think .cds{animation:tl 1.1s ease-in-out infinite alternate}@keyframes tl{to{transform:rotate(-4deg)}}
.pl.throw .cds{animation:th .7s}@keyframes th{40%{transform:translateY(36px)}}
.mh{position:relative;width:250px;height:178px;margin:4px auto}.fc{position:absolute;top:0;transform-origin:50% 100%}.fc .cd.my:active{transform:translateY(-6px)}
.hand{position:absolute;left:0;bottom:0;width:250px;height:90px;pointer-events:none}.mh{margin-top:32px}
.bub{position:absolute;top:6px;left:50%;transform:translateX(-50%) scale(.8);background:#fff;color:#1a1a1a;font:700 16px Karla,sans-serif;padding:7px 12px;border-radius:14px;max-width:92%;text-align:center;opacity:0;transition:.15s;pointer-events:none;z-index:3}
.bub.on{opacity:1;transform:translateX(-50%) scale(1)}
.bub:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-bottom:0;border-top-color:#fff}
.bub.me{top:-34px;background:var(--oro)}.bub.me:after{border-top-color:var(--oro)}
.cr{flex:1;text-align:right;margin-right:8px;font-size:12px;line-height:1.2;color:var(--oro)}
.col{display:flex;flex-direction:column;align-items:center;gap:6px}
.sl{width:62px;height:99px;border:2px dashed #f6edd330;border-radius:9px}
.lg{min-height:70px;font-size:14px;opacity:.9;margin:6px 2px}
.lg div:first-child{font-weight:700;opacity:1;color:var(--oro)}
.lg div{opacity:.7}
.act{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.b{font:700 15px Karla,sans-serif;padding:11px 14px;border:0;border-radius:9px;background:var(--oro);color:#1b1b1b;cursor:pointer}
.b.no{background:var(--rojo);color:#fff}.b.g{background:#f6edd322;color:var(--crema)}
.inf{text-align:center;font-size:14px;opacity:.85}
.ov{position:fixed;inset:0;background:#000b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:20px}
.ov h2{font:32px 'Alfa Slab One',Georgia,serif;margin:0;color:var(--oro)}
details{margin-top:18px;font-size:14px}summary{cursor:pointer;color:var(--oro)}
ol{padding-left:22px;margin:6px 0}
/* compacto vertical */
#app{padding:6px 12px 8px}
h1{font-size:18px;margin:2px 0 4px}
.sc{margin-bottom:5px}.sc div{padding:3px 10px}.sc b{font-size:20px}
.pl{height:min(23vh,170px);background:#1b2a22}
.cd.sm,.sl{width:46px;height:74px}
.tb{padding:6px 8px;margin:0 0 4px}
.mh{zoom:.78;margin-top:26px;margin-bottom:0}
.lg{min-height:0;margin:2px;font-size:13px}
.b{padding:9px 12px}
.act{position:sticky;bottom:0;z-index:4;margin-top:2px;padding:8px 0 calc(6px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(18,53,36,0),#123524 30%)}
.mn{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;padding-top:5vh}.mn .b{width:100%;padding:14px}.mn h2{font:24px 'Alfa Slab One',Georgia,serif;margin:0;color:var(--oro)}
input{font:16px Karla,sans-serif;padding:11px;border:0;border-radius:9px;width:100%;background:var(--crema);color:#1b1b1b}.rw{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:4px 0;text-align:left}.rw .b{flex:none}
</style></head><body><svg width="0" height="0" style="position:absolute"><defs><g stroke="#111" stroke-width="1.3" stroke-linejoin="round">
<symbol id="s-C" viewBox="0 0 40 64"><ellipse cx="20" cy="9" rx="18" ry="7" fill="#e11d1d"/><path d="M2,10 Q20,18 38,10 L36,19 Q20,25 4,19Z" fill="#f2c300"/><path d="M4,19 Q12,23 20,23.5 V43 H18 C12,39 5,35 4,19Z" fill="#f2c300"/><path d="M20,23.5 Q28,23 36,19 C35,35 28,39 22,43 H20Z" fill="#1f9d4a"/><path d="M9,22V33M14,24V37M26,24V37M31,22V33" fill="none" stroke-width="1"/><ellipse cx="20" cy="44" rx="6" ry="3.5" fill="#e11d1d"/><path d="M14,47 Q20,45 26,47 L27,55 Q20,51 13,55Z" fill="#1f9d4a"/><path d="M13,54 Q3,52 5,60 Q8,63 13,59Z M27,54 Q37,52 35,60 Q32,63 27,59Z" fill="#1f9d4a"/><path d="M12,59 H28 L33,63 H7Z" fill="#f2c300"/></symbol>
<symbol id="s-O" viewBox="0 0 40 64"><circle cx="20" cy="32" r="18" fill="#f2b705"/><circle cx="20" cy="32" r="13" fill="#f9dc5c"/><circle cx="20" cy="32" r="15.5" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="2 3"/><circle cx="20" cy="32" r="6" fill="#e11d1d"/><circle cx="20" cy="32" r="2.5" fill="#1f9d4a" stroke="none"/></symbol>
<symbol id="s-E" viewBox="0 0 40 64"><path d="M20,2 L26,9 V44 H14 V9Z" fill="#9fb4c9"/><path d="M20,6V44" fill="none" stroke-width="1"/><path d="M5,44 H35 L33,50 H7Z" fill="#f2c300"/><path d="M17,50 H23 V58 H17Z" fill="#8a4b1c"/><circle cx="20" cy="61" r="3" fill="#f2c300"/></symbol>
<symbol id="s-B" viewBox="0 0 40 64"><path d="M16,62 Q15,40 14,22 H26 Q25,40 24,62Z" fill="#b5651d"/><ellipse cx="20" cy="14" rx="11" ry="14" fill="#c77a2a"/><circle cx="20" cy="12" r="3" fill="#8a4b1c"/><circle cx="20" cy="40" r="2.5" fill="#8a4b1c"/><path d="M14,34 Q3,32 5,22 Q14,24 14,34Z M26,34 Q37,32 35,22 Q26,24 26,34Z" fill="#1f9d4a"/></symbol></g></defs></svg><div id="app"></div>
<script>
let NET=null,RN='',scr='name',rU=[];
const SU={E:{n:'Espadas',i:'🗡️',c:'#1e4fa8'},B:{n:'Bastos',i:'🌿',c:'#1f7a3a'},O:{n:'Oro',i:'🪙',c:'#a8680c'},C:{n:'Copas',i:'🍷',c:'#b3261e'}};
const NM={10:'Sota',11:'Caballo',12:'Rey'},TN=['','¡Truco!','¡Retruco!','¡Vale cuatro!'],EN={e:'¡Envido!',r:'¡Real Envido!',f:'¡Falta Envido!'};
const rnd=(a,b)=>a+Math.random()*(b-a),other=w=>w==='me'?'cpu':'me',who=w=>NET?(w==='me'?'«A»':'«B»'):(w==='me'?'Vos':'CPU');
function pw(c){const k=c.n+c.s;if(k=='1E')return 14;if(k=='1B')return 13;if(k=='7E')return 12;if(k=='7O')return 11;
 return {3:10,2:9,1:8,12:7,11:6,10:5,7:4,6:3,5:2,4:1}[c.n]}
const ev=c=>c.n>=10?0:c.n;
function en(cs){let b=Math.max(...cs.map(ev));for(let i=0;i<3;i++)for(let j=i+1;j<3;j++)if(cs[i].s===cs[j].s)b=Math.max(b,20+ev(cs[i])+ev(cs[j]));return b}
let S={me:0,cpu:0},H,busy=false,over=false,log=[];
function say(t){log.unshift(t);log=log.slice(0,4)}
function newGame(){S={me:0,cpu:0};over=false;log=[];newHand(Math.random()<.5?'me':'cpu')}
function newHand(mano){const d=[];for(const s in SU)for(const n of [1,2,3,4,5,6,7,10,11,12])d.push({n,s});
 for(let i=d.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[d[i],d[j]]=[d[j],d[i]]}
 const m=d.slice(0,3),c=d.slice(3,6);
 H={cards:{me:[...m],cpu:[...c]},orig:{me:m,cpu:c},pl:{me:[],cpu:[]},won:[],mano,turn:mano,tv:1,tc:0,tl:null,env:false,pend:null,end:null};
 busy=false;say(`Nueva mano. Reparte ${who(other(mano))}, arranca ${who(mano)}.`);next()}
function later(f,ms=850){busy=true;setCpu('think');render();setTimeout(()=>{busy=false;f()},ms)}
function chk(){if(S.me>=30||S.cpu>=30){S.me=Math.min(S.me,30);S.cpu=Math.min(S.cpu,30);over=true;render();return true}return false}
function next(){render();if(over||H.end||busy||H.pend)return;if(H.turn==='cpu'&&!NET)later(cpuTurn)}
/* --- cartas --- */
function play(w,i){const c=H.cards[w].splice(i,1)[0];H.pl[w].push(c);if(w==='cpu'){throwCard();speak(cardLine(c),'cpu')}say(`${who(w)} juega ${c.n} de ${SU[c.s].n}`);const r=H.won.length;
 if(H.pl.me.length>r&&H.pl.cpu.length>r){busy=true;render();setTimeout(resolve,1100)}else{H.turn=other(w);next()}}
function resolve(){const r=H.won.length,a=pw(H.pl.me[r]),b=pw(H.pl.cpu[r]),res=a>b?'me':b>a?'cpu':'t';H.won.push(res);busy=false;
 say(res==='t'?'Parda: empate':`Ronda ${r+1} para ${who(res)}`);const w=tw();if(w)return endHand(w,H.tv);
 H.turn=res==='t'?H.mano:res;next()}
function tw(){const w=H.won,[a,b,c]=w;if(w.length<2)return null;
 if(a!=='t'&&(b==='t'||b===a))return a;if(a==='t'&&b!=='t')return b;
 if(a==='t'&&b==='t')return c?(c==='t'?H.mano:c):null;return c?(c==='t'?a:c):null}
function endHand(w,p){H.pend=null;H.end={w,p};S[w]+=p;say(`Mano para ${who(w)}: +${p}`);if(chk())return;busy=true;render();setTimeout(()=>newHand(other(H.mano)),2400)}
function mazo(){if(NET==='g')return act('mazo');speak(pick(P.m),'me');say(NET?who('me')+' se va al mazo':'Vos te vas al mazo');endHand('cpu',H.tv)}
/* --- envido --- */
const envAllowed=w=>!H.env&&H.tc===0&&H.won.length===0&&!H.pend&&!H.end&&H.pl[w].length===0;
function envVal(ch){return ch.includes('f')?Math.max(1,30-Math.max(S.me,S.cpu)):ch.reduce((a,k)=>a+(k==='e'?2:3),0)}
function callEnv(w,k){if(NET==='g')return act('callEnv',w,k);H.pend={t:'env',from:w,chain:[k]};voice(w,k);say(`${who(w)}: ${EN[k]}`);w==='me'&&!NET?cpuRespEnv():render()}
function envTr(k){if(NET==='g')return act('envTr',k);H.trPend=H.pend;callEnv('me',k)}/* el envido va primero: cantás envido sobre el truco y después se retoma el truco */
function respEnv(w,a){if(NET==='g')return act('respEnv',w,a);const p=H.pend,f=p.from,ch=p.chain;
 if(a==='r'||a==='f'){ch.push(a);p.from=w;voice(w,a);say(`${who(w)}: ${EN[a]}`);return w==='me'&&!NET?cpuRespEnv():render()}
 H.pend=null;H.env=true;
 if(a==='n'){voice(w,'n');const v=ch.length>1?envVal(ch.slice(0,-1)):1;say(`${who(w)}: No quiero. +${v} para ${who(f)}`);S[f]+=v}
 else{const e={me:en(H.orig.me),cpu:en(H.orig.cpu)},win=e.me===e.cpu?H.mano:e.me>e.cpu?'me':'cpu',v=envVal(ch);voice(w,'q');setTimeout(()=>{if(!NET)speak(win==='cpu'?'Tengo '+e.cpu+'.':'¡Son buenas!','cpu')},1300);
  say(`Envido: ${NET?who('me'):'vos'} ${e.me}, ${NET?who('cpu'):'CPU'} ${e.cpu}. +${v} para ${who(win)}`);S[win]+=v}
 if(H.trPend){H.pend=H.trPend;H.trPend=null}
 if(chk())return;next()}
function cpuRespEnv(){later(()=>{const ch=H.pend.chain,e=en(H.orig.cpu);let a;
 if(ch.includes('f'))a=e>=30?'q':'n';
 else if(e>=31&&!ch.includes('r')&&Math.random()<.45)a='r';
 else a=e+rnd(-2,2)>=(ch.includes('r')?27:25)?'q':'n';respEnv('cpu',a)})}
/* --- truco --- */
const canTruco=w=>!H.pend&&!H.end&&H.tc<3&&H.tl!==w;
function callTruco(w){if(NET==='g')return act('callTruco',w);H.pend={t:'tr',from:w,lvl:H.tc+1};voice(w,'t'+(H.tc+1));say(`${who(w)}: ${TN[H.tc+1]}`);w==='me'&&!NET?cpuRespTr():render()}
function respTr(w,a){if(NET==='g')return act('respTr',w,a);const p=H.pend,f=p.from;
 if(a==='n'){voice(w,'n');say(`${who(w)}: No quiero`);return endHand(f,H.tv)}
 H.tc=p.lvl;H.tv=p.lvl+1;H.tl=f;H.pend=null;
 if(a==='r'){H.tl=w;H.pend={t:'tr',from:w,lvl:p.lvl+1};voice(w,'t'+(p.lvl+1));say(`${who(w)}: Quiero y ${TN[p.lvl+1]}`);return w==='me'&&!NET?cpuRespTr():render()}
 voice(w,'q');say(`${who(w)}: ¡Quiero!`);next()}
function cs(){const p=H.orig.cpu.map(pw).sort((a,b)=>b-a);return p[0]*.5+p[1]*.3+p[2]*.2+(H.won[0]==='cpu'?2:H.won[0]==='me'?-2:0)}
function cpuRespTr(){later(()=>{const l=H.pend.lvl,s=cs(),t=5.5+l*1.2+rnd(-1.5,1.5);
 respTr('cpu',s>=t+3&&l<3&&Math.random()<.5?'r':s>=t?'q':'n')})}
/* --- turno CPU --- */
function cpuPick(){const cs_=H.cards.cpu,r=H.won.length,o=H.pl.me[r],s=cs_.map((c,i)=>i).sort((a,b)=>pw(cs_[a])-pw(cs_[b]));
 if(o){const w=s.filter(i=>pw(cs_[i])>pw(o));return w.length?w[0]:s[0]}
 return r===0?s[Math.floor(s.length/2)]:s[s.length-1]}
function cpuTurn(){if(H.end||over)return;const e=en(H.orig.cpu);
 if(envAllowed('cpu')&&((e>=27&&Math.random()<.75)||(e<=21&&Math.random()<.06)))return callEnv('cpu',e>=32&&Math.random()<.4?'r':'e');
 if(canTruco('cpu')&&((cs()>=9&&Math.random()<.45)||Math.random()<.04))return callTruco('cpu');
 play('cpu',cpuPick())}
/* --- interfaz --- */
function clickCard(i){if(over||busy||H.end||H.pend||H.turn!=='me')return;NET==='g'?act('clickCard',i):play('me',i)}
const P={e:['¡Envido!','¿Tenés para el envido?','¡Envido, che!'],r:['¡Real envido!','¡Real envido, a ver qué hacés!'],f:['¡Falta envido!','¡Falta envido, jugátela!'],
t1:['¡Truco!','¡Truco, la puta que te parió!','¡Truco, che!'],t2:['¡Retruco!','¡Quiero retruco, loco!'],t3:['¡Vale cuatro!','¡Vale cuatro, y no me lo vas a querer!'],
q:['¡Quiero!','¡Quiero, dale!','Quiero, mostrame lo que tenés.'],n:['No quiero.','No, no quiero. Andá.','Naaa, no quiero.'],m:['Me voy al mazo.','Uh, me voy al mazo.']};
const pick=a=>a[Math.floor(Math.random()*a.length)],voice=(w,k)=>speak(pick(P[k]),w);
let mute=false,cpuS='idle',thr=false,bub={cpu:'',me:''},bt={};
function paint(w){push();const e=document.getElementById(w==='cpu'?'bc':'bm');if(e){e.textContent=bub[w];e.classList.toggle('on',!!bub[w])}}
function setBub(w,t){bub[w]=t;paint(w);clearTimeout(bt[w]);bt[w]=setTimeout(()=>{bub[w]='';paint(w)},1600+t.length*70)}
const cls=()=>'pl '+cpuS+(thr?' throw':'');
function setCpu(x){cpuS=x;const e=document.getElementById('cpu');if(e)e.setAttribute('class',cls())}
function throwCard(){thr=true;setTimeout(()=>{thr=false;setCpu(cpuS)},700)}
function speak(t,w){setBub(w,t);if(w==='cpu'){setCpu('talk');setTimeout(()=>setCpu('idle'),400+t.length*70)}
 if(mute||!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(t),vs=speechSynthesis.getVoices(),v=vs.find(x=>/es[-_]AR/i.test(x.lang))||vs.find(x=>/^es/i.test(x.lang));
 if(v)u.voice=v;u.lang=v?v.lang:'es-AR';u.rate=1.05;u.pitch=w==='cpu'?.6:1;speechSynthesis.cancel();speechSynthesis.speak(u)}
function cardLine(c){const k=c.n+c.s;if(k=='1E')return'¡Ancho de espadas, hermano!';if(k=='1B')return'¡Y el ancho de bastos!';if(k=='7E')return'¡Siete de espadas, ja!';if(k=='7O')return'¡El siete de oro!';return pick(['¡Tomá!','Va esta.','A ver si podés con esta.','¡Ahí va!'])}
function pips(n,s){const L={1:[[50,80,1.6]],2:[[50,50,.85],[50,110,.85]],3:[[50,38,.6],[50,80,.6],[50,122,.6]],4:[[30,52,.7],[70,52,.7],[30,108,.7],[70,108,.7]],5:[[30,50,.65],[70,50,.65],[50,80,.65],[30,110,.65],[70,110,.65]],6:[[28,46,.56],[72,46,.56],[28,80,.56],[72,80,.56],[28,114,.56],[72,114,.56]],7:[[28,46,.56],[72,46,.56],[50,63,.56],[28,80,.56],[72,80,.56],[28,114,.56],[72,114,.56]]};
 return L[n].map(([x,y,k])=>`<g transform="translate(${x},${y}) rotate(${y>85?180:0}) scale(${k}) translate(-20,-32)"><use href="#s-${s}" width="40" height="64"/></g>`).join('')}
function fig(n,s){const c={10:'#c0392b',11:'#2e6fb5',12:'#7b3fa0'}[n],b=n===11?104:130;
 let h='<rect x="20" y="30" width="60" height="100" fill="#f3d99b" stroke="#111"/>';
 if(n===11)h+='<ellipse cx="46" cy="108" rx="26" ry="12" fill="#8d6e63" stroke="#111"/><path d="M64,100 L76,80 Q84,84 80,96 L72,112Z" fill="#8d6e63" stroke="#111"/><path d="M30,116V132M40,118V132M56,118V132M64,116V132" stroke="#5d4037" stroke-width="4"/>';
 h+=`<path d="M34,${b} L38,72 H62 L66,${b}Z" fill="${c}" stroke="#111"/><circle cx="50" cy="62" r="9" fill="#f1c9a0" stroke="#111"/>`;
 h+=n===12?'<path d="M39,56 L40,42 L45,50 L50,40 L55,50 L60,42 L61,56Z" fill="#f2c300" stroke="#111"/>':n===11?'<path d="M40,58 Q50,38 60,58Z" fill="#555" stroke="#111"/>':`<path d="M39,58 Q50,44 61,58Z" fill="${c}" stroke="#111"/><path d="M58,50 Q70,40 66,56" stroke="#e11d1d" stroke-width="2.5" fill="none"/>`;
 return h+`<use href="#s-${s}" x="62" y="76" width="16" height="26"/>`}
function cardSVG(c,x='',a=''){const t='font-family="Georgia,serif" font-size="18" text-anchor="middle" fill="#111"';

function poll(get,key,cb,ms){let last,dead=false,tm;const f=async()=>{if(dead)return;try{const s=await get();const k=key(s);if(k!==last){last=k;if(!dead)cb(s)}}catch(e){}if(!dead)tm=setTimeout(f,ms)};f();return()=>{dead=true;clearTimeout(tm)}}
const docRef=p=>({id:p.split('/').pop(),
